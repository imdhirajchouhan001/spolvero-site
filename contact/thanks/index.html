<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message sent — Spolvero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101057">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/" aria-label="Spolvero home"></a>
    </div>
  </header>

  <main id="main" class="center-page">
    <div class="wrap">
      <span class="status status-live">Sent</span>
      <h1 id="title" style="margin-top:20px">Message sent. Thanks for writing.</h1>
      <p class="lede" id="lede">We'll reply to the email you gave, usually within two working days.</p>
      <div class="actions">
        <a class="btn btn-solid" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/unspend/">See Unspend</a>
      </div>
    </div>
  </main>

  <script>
    if (new URLSearchParams(location.search).get("from") === "updates") {
      document.getElementById("title").textContent = "You're on the launch list.";
      document.getElementById("lede").textContent = "We'll email you when something new ships. Nothing else.";
      document.querySelector(".status").textContent = "Subscribed";
    }
  </script>
</body>
</html>
